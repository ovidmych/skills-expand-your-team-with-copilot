name: Data Management
description: Request to manage student enrollments, remove students, or update activity data
title: "[Data]: "
labels: ["data-management"]
body:
  - type: markdown
    attributes:
      value: |
        ## Data Management Request
        Use this template to request changes to student enrollment data or activity participant lists.
        
  - type: dropdown
    id: request-type
    attributes:
      label: Type of Data Request
      description: What kind of data management do you need?
      options:
        - Remove student from activity
        - Bulk enroll students in activity
        - Clear all participants from activity
        - Export participant list
        - Update student email
        - Reset activity data
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: activity-name
    attributes:
      label: Activity Name
      description: Which activity does this request concern?
      placeholder: "e.g., Chess Club, Soccer Team"
    validations:
      required: true

  - type: textarea
    id: student-emails
    attributes:
      label: Student Email(s)
      description: List the student email addresses involved (one per line)
      placeholder: |
        john.smith@mergington.edu
        jane.doe@mergington.edu
        alex.johnson@mergington.edu
    validations:
      required: false

  - type: textarea
    id: request-details
    attributes:
      label: Request Details
      description: Provide specific details about what needs to be done
      placeholder: "Example: 'Remove john.smith@mergington.edu from Chess Club because the student has transferred to another school' or 'Add the following 5 students to Morning Fitness'"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Request
      description: Why is this data change needed?
      placeholder: "Example: 'Student dropped the activity', 'New semester enrollment', 'Student transferred', 'Correcting an error'"
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency Level
      description: How urgent is this request?
      options:
        - Low - Can be done anytime this week
        - Medium - Needed within 1-2 days
        - High - Needed today
        - Urgent - Blocking activity operations
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm you understand these changes
      options:
        - label: I understand this will modify the database
          required: true
        - label: I have verified the student email addresses are correct
          required: false
        - label: I have permission to make this data change
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## Acceptance Criteria
        - The specified data changes should be made accurately
        - Students should be properly added or removed from activities
        - All email addresses should be validated before processing
        - Changes should be reflected immediately in the system
        - Confirmation message should indicate success
        
        ## Implementation Hints
        - Use the existing API endpoints in `src/backend/routers/activities.py`
        - For removing students: Use the `/activities/{activity_name}/unregister` endpoint
        - For adding students: Use the `/activities/{activity_name}/signup` endpoint
        - For bulk operations: Consider creating a script or loop through the API
        - Validate email format: should end with @mergington.edu
        - Check if student is already enrolled before adding
        - Check if student is enrolled before removing
        - Handle errors gracefully with clear messages
        
        ## Related Information
        - Database structure: `src/backend/database.py`
        - API routes: `src/backend/routers/activities.py`
        - Participants are stored in the `participants` array for each activity
        - Changes are stored in MongoDB collection `activities_collection`
